[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trendvision-ai"
version = "0.2.0"
description = "Local Windows dashboard for TrendVision Discord scanner notifications"
requires-python = ">=3.10"
dependencies = [
    "pywinauto==0.6.9; platform_system == 'Windows'",
    "PySide6==6.11.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trendvision-ai"
version = "0.1.0"
description = "Local Windows listener for TrendVision Discord scanner notifications"
requires-python = ">=3.11"
dependencies = [
    "pywinauto==0.6.9; platform_system == 'Windows'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
